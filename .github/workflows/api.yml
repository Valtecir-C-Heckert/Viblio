name: Viblio API CI
on:
  push:
    branches: [main]
    paths:
      - 'viblio-api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'viblio-api/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_USER: viblio
          POSTGRES_PASSWORD: viblio_ci_only_password
          POSTGRES_DB: viblio_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked runtime and pinned test dependencies
        working-directory: viblio-api
        run: |
          python -m pip install --no-cache-dir -r requirements.lock pytest==8.3.5 httpx==0.28.1
      - name: Run API pytest suite
        working-directory: viblio-api
        env:
          PYTHONPATH: .
          VIBLIO_TEST_DATABASE_URL: postgresql://viblio:viblio_ci_only_password@127.0.0.1:5432/viblio_test_ci
        run: |
          pytest -v tests/
          python -m unittest -v tests/test_updater.py
