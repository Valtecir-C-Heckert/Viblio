name: Viblio API CI
on:
  push:
    branches: [main]
    paths:
      - 'viblio-api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'viblio-api/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: viblio
          POSTGRES_PASSWORD: viblio_ci_only_password
          POSTGRES_DB: viblio_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: viblio-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.in pytest httpx
      - name: Run API pytest suite
        working-directory: viblio-api
        env:
          PYTHONPATH: .
          VIBLIO_TEST_DATABASE_URL: postgresql://viblio:viblio_ci_only_password@127.0.0.1:5432/viblio_test_ci
        run: |
          pytest -v tests/
          python -m unittest -v tests/test_updater.py
