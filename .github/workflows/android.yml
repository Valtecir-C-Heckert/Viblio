name: Viblio Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon :viblio:assembleDebug :viblio:testDebugUnitTest :viblio:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: viblio-debug
          path: viblio/build/outputs/apk/debug/viblio-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viblio-validation-reports
          path: |
            viblio/build/reports/tests/
            viblio/build/reports/lint-results-debug.*
