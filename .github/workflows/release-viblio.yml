name: Release Viblio (Signed APK + API)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: viblio-release
  cancel-in-progress: false
jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install pinned Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run unit tests without signing credentials
        run: ./gradlew --no-daemon :viblio:testDebugUnitTest

  build-and-sign:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      EXPECTED_CERT_SHA256: "5953e6c8ec5145afca3d40fb202e54522418b1599015dda43361e08b7757ede0"
    outputs:
      version: ${{ steps.verify.outputs.version }}
      vcode: ${{ steps.verify.outputs.vcode }}
      has_api: ${{ steps.verify.outputs.has_api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Install pinned Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Decode and validate preserved Android keystore
        id: keystore
        env:
          RELEASE_KS_B64: ${{ secrets.VIBLIO_RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASS: ${{ secrets.VIBLIO_RELEASE_STORE_PASS }}
          RELEASE_KEY_ALIAS: ${{ secrets.VIBLIO_RELEASE_KEY_ALIAS }}
          DEBUG_KS_B64: ${{ secrets.VIBLIO_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/android-user"
          chmod 700 "${RUNNER_TEMP}/android-user"
          if [[ -n "${RELEASE_KS_B64}" ]]; then
            KS_FILE="${RUNNER_TEMP}/android-user/release.keystore"
            printf '%s' "${RELEASE_KS_B64}" | tr -d ' \t\r\n' | base64 -d > "${KS_FILE}"
            chmod 600 "${KS_FILE}"
            KS_PASS="${RELEASE_STORE_PASS}"
            KS_ALIAS="${RELEASE_KEY_ALIAS}"
            echo "mode=release" >> "${GITHUB_OUTPUT}"
            echo "path=${KS_FILE}" >> "${GITHUB_OUTPUT}"
          else
            if [[ -z "${DEBUG_KS_B64}" ]]; then
              echo "::error::Nenhum keystore configurado (VIBLIO_RELEASE_KEYSTORE_B64 ou VIBLIO_DEBUG_KEYSTORE_B64)."
              exit 1
            fi
            KS_FILE="${RUNNER_TEMP}/android-user/debug.keystore"
            printf '%s' "${DEBUG_KS_B64}" | tr -d ' \t\r\n' | base64 -d > "${KS_FILE}"
            chmod 600 "${KS_FILE}"
            KS_PASS="android"
            KS_ALIAS="androiddebugkey"
            echo "mode=debug" >> "${GITHUB_OUTPUT}"
            echo "path=" >> "${GITHUB_OUTPUT}"
          fi
          KS_SHA256="$(keytool -list -v -keystore "${KS_FILE}" -storepass "${KS_PASS}" -alias "${KS_ALIAS}" | awk '/SHA256:/ {gsub(/:/,"",$2); print tolower($2); exit}')"
          if [[ "${KS_SHA256}" != "${EXPECTED_CERT_SHA256}" ]]; then
            echo "::error::Certificado do keystore não corresponde ao certificado preservado do Viblio."
            echo "Esperado:   ${EXPECTED_CERT_SHA256}"
            echo "Encontrado: ${KS_SHA256}"
            exit 1
          fi
          echo "Keystore validado: SHA-256 corresponde exatamente ao certificado preservado (${KS_SHA256})."
      - name: Build signed release APK
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/android-user
          VIBLIO_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          VIBLIO_STORE_PASS: ${{ secrets.VIBLIO_RELEASE_STORE_PASS }}
          VIBLIO_KEY_ALIAS: ${{ secrets.VIBLIO_RELEASE_KEY_ALIAS }}
          VIBLIO_KEY_PASS: ${{ secrets.VIBLIO_RELEASE_KEY_PASS }}
        run: |
          ./gradlew --no-daemon :viblio:assembleRelease
      - name: Clean up temporary keystore
        if: always()
        run: |
          for f in "${RUNNER_TEMP}/android-user/debug.keystore" "${RUNNER_TEMP}/android-user/release.keystore"; do
            if [[ -f "$f" ]]; then
              shred -u "$f" || rm -f "$f"
            fi
          done
          rm -rf "${RUNNER_TEMP}/android-user"
      - name: Verify APK signature, package, versionCode and non-debuggable release
        id: verify
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          AAPT2="${BUILD_TOOLS}/aapt2"
          APK_SRC="viblio/build/outputs/apk/release/viblio-release.apk"
          [[ -f "${APK_SRC}" ]] || { echo "::error::APK release não encontrado."; exit 1; }

          echo "=== apksigner verify (novo APK release) ==="
          NEW_CERTS="$("${APKSIGNER}" verify --verbose --print-certs "${APK_SRC}")"
          echo "${NEW_CERTS}"
          NEW_SHA256="$(printf '%s\n' "${NEW_CERTS}" | awk '/Signer #1 certificate SHA-256 digest:/ {print tolower($NF); exit}')"

          if [[ "${NEW_SHA256}" != "${EXPECTED_CERT_SHA256}" ]]; then
            echo "::error::Assinatura do APK (${NEW_SHA256}) não confere com esperado (${EXPECTED_CERT_SHA256})."
            exit 1
          fi
          if [[ -f downloads/viblio-0.4.5.apk ]]; then
            PREV_CERTS="$("${APKSIGNER}" verify --print-certs downloads/viblio-0.4.5.apk)"
            PREV_SHA256="$(printf '%s\n' "${PREV_CERTS}" | awk '/Signer #1 certificate SHA-256 digest:/ {print tolower($NF); exit}')"
            if [[ "${NEW_SHA256}" != "${PREV_SHA256}" ]]; then
              echo "::error::Assinatura do APK não confere com 0.4.5 (${PREV_SHA256})."
              exit 1
            fi
          fi

          BADGING="$("${AAPT2}" dump badging "${APK_SRC}")"
          PKG="$(printf '%s\n' "${BADGING}" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          VCODE="$(printf '%s\n' "${BADGING}" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n1)"
          VNAME="$(printf '%s\n' "${BADGING}" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)"
          echo "package=${PKG} versionCode=${VCODE} versionName=${VNAME}"

          [[ "${PKG}" == "br.com.viblio" ]] || { echo "::error::applicationId inesperado: ${PKG}"; exit 1; }
          (( VCODE > 41 )) || { echo "::error::versionCode (${VCODE}) precisa ser maior que 41."; exit 1; }
          if printf '%s\n' "${BADGING}" | grep -q "application-debuggable"; then
            echo "::error::APK release está marcado como debuggable."
            exit 1
          fi
          echo "Non-debuggable release verified (application-debuggable absent)."

          OUT_DIR="${RUNNER_TEMP}/release"
          mkdir -p "${OUT_DIR}"
          APK_OUT="${OUT_DIR}/viblio-${VNAME}.apk"
          cp "${APK_SRC}" "${APK_OUT}"
          APK_SHA256="$(sha256sum "${APK_OUT}" | awk '{print $1}')"

          API_SRC="downloads/viblio-api-${VNAME}.zip"
          HAS_API="false"
          SUMS_OUT="${OUT_DIR}/viblio-${VNAME}-SHA256SUMS.txt"
          printf '%s  %s\n' "${APK_SHA256}" "$(basename "${APK_OUT}")" > "${SUMS_OUT}"

          if [[ -f "${API_SRC}" ]]; then
            EXPECTED_API_SHA="$(awk -v name="$(basename "${API_SRC}")" '$2==name {print $1}' downloads/SHA256SUMS)"
            API_SHA256="$(sha256sum "${API_SRC}" | awk '{print $1}')"
            if [[ -z "${EXPECTED_API_SHA}" || "${API_SHA256}" != "${EXPECTED_API_SHA}" ]]; then
              echo "::error::Checksum de ${API_SRC} não confere com downloads/SHA256SUMS."
              exit 1
            fi
            API_OUT="${OUT_DIR}/$(basename "${API_SRC}")"
            cp "${API_SRC}" "${API_OUT}"
            printf '%s  %s\n' "${API_SHA256}" "$(basename "${API_OUT}")" >> "${SUMS_OUT}"
            HAS_API="true"
          fi

          echo "=== SHA256SUMS ==="
          cat "${SUMS_OUT}"
          {
            echo "version=${VNAME}"
            echo "vcode=${VCODE}"
            echo "has_api=${HAS_API}"
          } >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viblio-release-bundle
          path: ${{ runner.temp }}/release/*
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build-and-sign
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: viblio-release-bundle
          path: ${{ runner.temp }}/release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build-and-sign.outputs.version }}
          VCODE: ${{ needs.build-and-sign.outputs.vcode }}
          HAS_API: ${{ needs.build-and-sign.outputs.has_api }}
        run: |
          set -euo pipefail
          OUT_DIR="${RUNNER_TEMP}/release"
          (cd "${OUT_DIR}" && sha256sum -c "viblio-${VERSION}-SHA256SUMS.txt")
          tag="viblio-v${VERSION}"
          notes="${RUNNER_TEMP}/viblio-notes.md"
          if [[ "${HAS_API}" == "true" ]]; then
            cat > "$notes" <<NOTES
          APK assinado com o certificado preservado do Viblio (versionCode ${VCODE}, release não depurável) para atualizar por cima sem desinstalar nem perder dados locais.

          Atualize a API no servidor com \`viblio-api-${VERSION}.zip\` antes de instalar o APK.
          NOTES
          else
            cat > "$notes" <<NOTES
          APK assinado com o certificado preservado do Viblio (versionCode ${VCODE}, release não depurável) para atualizar por cima sem desinstalar nem perder dados locais.

          Somente APK: não há atualização da API nesta versão.
          NOTES
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Viblio ${VERSION}" --notes-file "$notes"
          fi
          for file in "${OUT_DIR}"/*; do
            [[ -f "$file" ]] || continue
            name="$(basename "$file")"
            existing="$(mktemp -d)"
            if gh release download "$tag" --pattern "$name" --dir "$existing" >/dev/null 2>&1; then
              cmp "$file" "$existing/$name"
            else
              gh release upload "$tag" "$file"
            fi
            rm -rf "$existing"
          done
          gh release edit "$tag" --draft=false --latest
          ready="tags/viblio-download-ready-${VERSION}"
          if ! gh api "repos/${GH_REPO}/git/ref/${ready}" >/dev/null 2>&1; then
            gh api --method POST "repos/${GH_REPO}/git/refs" -f "ref=refs/${ready}" -f "sha=${GITHUB_SHA}" >/dev/null
          fi
